name = "RowmapLean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["RowmapLean"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
# the Mathlib header linter insists on Mathlib's Apache-2.0 wording; this project is MIT
weak.linter.style.header = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc2"

[[lean_lib]]
name = "RowmapLean"